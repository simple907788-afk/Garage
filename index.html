<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <title>GARAGE BAND</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #interface {
      position: fixed;
      z-index: 9999;
      left: 0;
      right: 0;
      bottom: 45px;
      text-align: center;
      pointer-events: none;
    }

    #status {
      color: white;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 18px;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    #playButton,
    #replayButton {
      display: none;
      pointer-events: auto;
      appearance: none;
      border: 1px solid white;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 16px 28px;
      font-size: 14px;
      letter-spacing: 3px;
      font-weight: bold;
      cursor: pointer;
    }

    #playButton.active,
    #replayButton.active {
      display: inline-block;
    }

    #playButton:active,
    #replayButton:active {
      background: white;
      color: black;
    }

    #loading {
      position: fixed;
      z-index: 10000;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      letter-spacing: 3px;
    }

    #loading.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div id="loading">
    LOADING GARAGE...
  </div>

  <div id="interface">

    <div id="status">
      AIM AT THE GARAGE
    </div>

    <button id="playButton">
      PLAY TRACK 01
    </button>

    <button id="replayButton">
      REPLAY
    </button>

  </div>

  <!--
    MindAR AR Scene
    targets.mind 파일은 이 index.html과 같은 폴더에 있어야 합니다.
  -->

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse;"
      raycaster="objects: .clickable"
    ></a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
    </a-entity>

  </a-scene>

  <!-- 음악 -->
  <audio
    id="music"
    src="./music.mp3"
    preload="auto"
    playsinline
  ></audio>

  <script>
    const target = document.querySelector("#target");
    const music = document.querySelector("#music");

    const status = document.querySelector("#status");
    const playButton = document.querySelector("#playButton");
    const replayButton = document.querySelector("#replayButton");
    const loading = document.querySelector("#loading");

    let targetDetected = false;

    /*
      MindAR 로딩이 끝나면 로딩 화면 제거
    */
    window.addEventListener("load", function () {
      setTimeout(function () {
        loading.classList.add("hidden");
      }, 1500);
    });

    /*
      이미지 인식 성공
    */
    target.addEventListener("targetFound", function () {

      targetDetected = true;

      status.textContent = "GARAGE DETECTED";

      playButton.classList.add("active");

      replayButton.classList.remove("active");
    });

    /*
      이미지가 카메라에서 사라짐
    */
    target.addEventListener("targetLost", function () {

      targetDetected = false;

      status.textContent = "AIM AT THE GARAGE";

      playButton.classList.remove("active");
    });

    /*
      PLAY 버튼
      아이폰에서는 사용자가 직접 버튼을 눌러야
      음악 재생이 허용되는 경우가 많습니다.
    */
    playButton.addEventListener("click", async function () {

      try {

        await music.play();

        status.textContent = "NOW PLAYING — TRACK 01";

        playButton.classList.remove("active");

        replayButton.classList.add("active");

      } catch (error) {

        console.log("Audio playback error:", error);

        status.textContent = "TAP AGAIN TO PLAY";

      }

    });

    /*
      REPLAY 버튼
    */
    replayButton.addEventListener("click", async function () {

      try {

        music.currentTime = 0;

        await music.play();

        status.textContent = "NOW PLAYING — TRACK 01";

      } catch (error) {

        console.log("Replay error:", error);

      }

    });

    /*
      음악이 끝나면 다시 재생할 수 있게 함
    */
    music.addEventListener("ended", function () {

      status.textContent = "TRACK 01 ENDED";

      replayButton.classList.add("active");

    });
  </script>

</body>
</html>
